# Contexte

Forte augmentation des menaces et des règlementation

- *Cyber Resilience Act* (CRA - EU)

Impacts : 

- ➡️ **Résilience** des systèmes
- ➡️ **Souveraineté**
- ➡️ **Écosystème** économique et commaunautaire

Note:
- CRA et NIS2 vont rentrer en vugueur au niveau européen



---

## 😱 Menaces 😱

- **Ransomware** : perdez vos data, ou votre argent ?
- **Supply chain attacks** : infection de source code, builds, infrastructure
  - exemple: [XZ Utils](https://en.wikipedia.org/wiki/XZ_Utils_backdoor)
- **Malware attacks** : vol de données, pénétration d'infrastructure, destruction de matériels
- **Vulnerability exploits** : prise de contrôle de votre matériel, vos serveurs ( *be a botnet !*)
- **Password attacks** : découverte ou brute-force des mots de passe et accès non autorisés

Note:
- Supply chain attacks: exemple NPM
- XZ Utils: 
  - 3 ans de contribution,
  - Gagné les droits de commit en faisant pression sur le mainteneur en utilisant des faux comptes
  - Poussez du code offusqué
  - Infecté SSH et permet de prendre le controle de la machine
  - Version de dev des distrib mais pas en production
  - Trouvé par hasard pour des questions de perfs et d'erreur valgrind
  - Trouvé par un dev Postgres chez Microsoft
- Malware attacks: logiciel malveillant qui s'installent
- Vulnérability exploits: explotation de vulnérabilité du logiciel pour prendre controle...
- Botnets: plusieurs soft malveillant qui se regroupent pour attaquer (DDos)
- Password attacks : social engeneering, phishing

Bcp de typologie d'attaques

---

## 🔥 Conséquences 🔥

- **Pertes financières** : pertes directs, amendes, coûts légaux, réputation…
- **Atteinte aux données** : diffusion ou destruction de données sensibles, confidentielles, protégées
- **Vol d'identité** : fraude financière, fraude à l'identité, vol de comptes…
- **Interruption de services** : downtime, indisponibilité, pertes financières, arrêt d'activité, perte de confiance des clients…
- **Impacts physiques** : e.g. domotique, accès aux systèmes SCADA…

Note:
- PF: bitcoin, asset financier ou indirect via amendes, cout avocat
- SCADA: System industriel de pilotage a distance de pompe, machine...

- Automatisé

---

- Suivi des vulnérabilités des dépendances

---

### 4. Analyse globale de sécurité et audit externe

- Audit humain du code

---

### 5. Processus GitHub et gestion des contributions

- Comment on devient core-commiter ?
- Comment on contribue quand on a pas les accés

- => Accès à tout l'espace utilisateur

  - exemple: Anti-virus

---

### 8. Formation, documentation, visibilité pour la cybersécurité

- Acculturation / formation (développeurs et utilisateurs)
- Documents de référence

---

### 9. Amélioration de la gestion mémoire

[NSA](https://www.nsa.gov/Press-Room/News-Highlights/Article/Article/3215760/nsa-releases-guidance-on-how-to-protect-against-software-memory-safety-issues/), Novembre 2022

> Microsoft and Google have each stated that software **memory safety issues are behind around 70 percent of their vulnerabilities**. Poor memory management **can lead to technical issues as well**, such as incorrect program results, degradation of the program’s performance over time, and program crashes.

---

> **NSA recommends that organizations use memory safe languages** when possible and bolster protection through **code-hardening** defenses such as compiler options, tool options, and operating system configurations.

- 60/80% des vulnérabilités sont issus de problème de gestion mémoire
  - out-of-bound access / use-after-free
  - Exemple : 2014 Heartbleed dans OpenSSL
- Rendre le code MSL (ou presque)

Note:
- C++ pas MSL de base mais en utilisant les donnes structures de controle et en ajoutant des checks, c'est possible
