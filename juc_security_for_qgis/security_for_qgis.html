### Memory Safety c'est quoi le problème ?

[NSA](https://www.nsa.gov/Press-Room/News-Highlights/Article/Article/3215760/nsa-releases-guidance-on-how-to-protect-against-software-memory-safety-issues/), Novembre 2022

> Microsoft and Google have each stated that software **memory safety issues are behind around 70 percent of their vulnerabilities**. Poor memory management **can lead to technical issues as well**, such as incorrect program results, degradation of the program’s performance over time, and program crashes.

---

> **NSA recommends that organizations use memory safe languages** when possible and bolster protection through **code-hardening** defenses such as compiler options, tool options, and operating system configurations.

---

- Memory safe language
  - Avec "interpreter" 🐢 : Java, Python, TypeScript 
  - Sans: Rust

### Memory Safety c'est quoi le problème ?
#### Attention, vous allez voir du C++ 😱

---

### Allouer de la mémoire

```c++
class MaClasse
{
   int i = 0;
};

MaClasse *monObject = new MaClasse();
```

<img src="memoire.png" height="200" />

pointeur = adresse !


---

### La libérer, ~délivrer~ ❄️

```c++
delete monObject; // détruire l'espace mémoire alloué
monObject = nullptr; // effacer l'adresse
```

<img src="liberer.jpg" height="200" />

---

### Et si on oubli...

- delete
  - fuites mémoire 💧 (memory leak)
  - Application grossit en mémoire
- = nullptr (dangling pointer)
  - Accés à un segment mémoire détruit: CRASH 💥

### Manuel du petit hacker 📖

⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️ ULTRA SIMPLIFICATION  ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️

- Je combine:
  - un oubli de **delete** pour "laisser" un objet
  - un oubli de **=nullptr** pour utiliser un objet "laissé"

### Comment on corrige

```c++
// MaClasse *monObject = new MaClasse();
std::unique_ptr<MaClasse> monObject = std::make_unique<MaClasse>();

// delete monObject;
// monObject = nullptr;
monObject.reset();
```

On remplace 2 instructions par 1 seule!!!

### Clang query

Requête sur du code (comme du SQL ou XPath)

```c++
cxxDestructorDecl(
	isExpansionInFileMatching( "QGIS/src/core/.*" ),
	has(compoundStmt(forEach(cxxDeleteExpr(
				   has(implicitCastExpr(has(memberExpr(has(cxxThisExpr())).bind("member"))))
					      ).bind("deleteExpr")
				)))).bind("destructor");
```

Exemple: Matche tous les destructeur C++ qui contienne un delete d'une variable membre

- Requête identification patterns ➡️ Remplace
